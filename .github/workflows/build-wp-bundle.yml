name: Build WP bundle

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wp-adapter.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/build-wp-bundle.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm ci || npm i
          npm i -D esbuild

      - name: Build bundle (IIFE global TikkunCore)
        run: |
          npx esbuild wp-adapter.ts \
            --bundle \
            --loader:.ts=ts \
            --format=iife \
            --global-name=TikkunCore \
            --outfile=dist/tikkun-core.iife.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tikkun-core.iife.js
          path: dist/tikkun-core.iife.js
